[project]
name = "multi-agent-insurance-claims-investigation-assistant"
version = "0.1.0"
description = "LangGraph claims-fraud investigation assistant: Random Forest scoring, RAG evidence, Groq recommendations, human-in-the-loop feedback."
readme = "README.md"
authors = [
    { name = "Mukesh Kumar", email = "mukeshkumarb107@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.5.0",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
multi-agent-insurance-claims-investigation-assistant = "multi_agent_insurance_claims_investigation_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
