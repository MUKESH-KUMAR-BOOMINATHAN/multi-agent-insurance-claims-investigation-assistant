[project]
name = "multi-agent-insurance-claims-investigation-assistant"
version = "0.1.0"
description = "LangGraph claims-fraud investigation assistant: Random Forest scoring, RAG evidence, Groq recommendations, human-in-the-loop feedback."
readme = "README.md"
authors = [
    { name = "Mukesh Kumar", email = "mukeshkumarb107@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.5.0",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.3",
]

# An application, not an installable library: uv manages the environment only.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
