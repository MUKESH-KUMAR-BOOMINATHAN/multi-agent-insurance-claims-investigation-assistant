# Render Blueprint for the API (the frontend is deployed separately on Vercel).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render then asks
# for the values marked `sync: false` (see README -> "Deploy your own").
#
# FREE setup (no cost anywhere):
#   * Render free web service: sleeps after ~15 min without traffic and takes
#     about a minute to wake; its filesystem is wiped on every deploy/restart.
#   * So ALL data lives in a free Postgres database outside Render (Neon's free
#     tier: https://neon.tech). Put its connection string in DATABASE_URL.
#     Without DATABASE_URL the app would fall back to SQLite files that are
#     wiped on every restart: never deploy like that.
#
# Upgrading later needs no code change: switch `plan` to a paid instance (no
# sleep) and/or move DATABASE_URL to a paid database.

services:
  - type: web
    name: claimguard-api
    runtime: python
    plan: free
    region: oregon
    # One worker only: the Groq budget, circuit breaker, cache and per-IP rate
    # limiters live in process memory. (Account lockouts and the audit log are in
    # the database, so they survive the free instance going to sleep.)
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev
    startCommand: >-
      .venv/bin/uvicorn main:app
      --host 0.0.0.0 --port $PORT --workers 1
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      # Postgres connection string from Neon (Dashboard -> Connect), e.g.
      # postgresql://user:password@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Random per environment; Render generates it and keeps it stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      # The admin account. Hash from `python scripts/hash_password.py`.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Your Vercel URL(s), comma separated, no trailing slash, e.g. https://claimguard.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REASONING_EFFORT
        value: low
